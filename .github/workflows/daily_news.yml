name: Daily AI/IT News to LINE

on:
  # schedule:
  #   # 日本時間 (JST) 毎朝 7:00 実行 = 22:00 UTC (前日)
  #   - cron: '23 22 * * *'
  # 手動テスト用ボタン
  workflow_dispatch:

permissions:
  contents: write  # ダッシュボード用統計データ（data/stats.json）をコミットし直すために必要

jobs:
  run-news-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Main Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python main.py

      - name: Commit updated dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stats.json
          if git diff --staged --quiet; then
            echo "ダッシュボード用データに変更はありません。コミットをスキップします。"
          else
            git commit -m "chore: update dashboard stats for $(date -u +'%Y-%m-%d')"
            git push
          fi
