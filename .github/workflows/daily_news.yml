name: Daily AI/IT News to LINE

on:
  # schedule:
  #   # 日本時間 (JST) 毎朝 7:00 実行 = 22:00 UTC (前日)
  #   - cron: '23 22 * * *'
  # 手動テスト用ボタン
  workflow_dispatch:

permissions:
  contents: write
  actions: write  # 最終ステップで pages.yml を workflow_dispatch 連鎖起動するために必要  # ダッシュボード用統計データ（data/stats.json）とニュースデータ（data/news/）をコミットし直すために必要

jobs:
  run-news-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Main Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python main.py

      - name: Commit updated dashboard data and news data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stats.json data/news

          if git diff --staged --quiet; then
            echo "ダッシュボード用データとニュースデータに変更はありません。コミットをスキップします。"
            exit 0
          fi

          git commit -m "chore: update dashboard stats and news data for $(date -u +'%Y-%m-%d')"

          # 実行タイミングが重なり、pushの間にmainが先に更新されていることがあるため、
          # pull --rebase してpushし直すリトライを行う（最大5回）。
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "data/stats.json と data/news のプッシュに成功しました。"
              exit 0
            fi
            echo "プッシュが失敗しました（リモートのmainが更新されている可能性があります）。pull --rebase して再試行します… ($attempt/5)"
            git pull --rebase origin main
            sleep $((attempt * 3))
          done

          echo "::error::複数回再試行しましたが、data/stats.json と data/news のプッシュに失敗しました。"
          exit 1

      - name: Trigger Pages deploy
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "pages.yml のデプロイを起動しました。"
