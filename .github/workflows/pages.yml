name: Deploy Dashboard to GitHub Pages

# このワークフローは dashboard/index.html と data/stats.json のみを
# GitHub Pagesで公開する。main.py / config.py / stats_recorder.py などの
# ソースコードやワークフロー定義はPagesの公開対象に含めない。

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'data/stats.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時デプロイの競合を避ける（実行中のデプロイは待機させ、キャンセルはしない）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build public site (dashboard + data only)
        run: |
          mkdir -p _site/dashboard _site/data
          cp dashboard/index.html _site/dashboard/index.html
          if [ -f data/stats.json ]; then
            cp data/stats.json _site/data/stats.json
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload public site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
